<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex SOS · dot 助手</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><div class="brand"><span class="ring" aria-hidden="true"></span><div><b>Codex SOS</b><span id="subtitle"></span></div></div><div class="toolbar"><select id="language" aria-label="Language / 语言"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option></select><button id="classic"></button><button id="quit" class="quiet"></button></div></header>
<main><section class="hero"><div><p class="eyebrow" id="eyebrow"></p><h1 id="headline"></h1><p id="intro"></p></div><button class="primary" id="add"></button></section>
<div id="fixture" hidden></div><section class="connection"><div><b id="connectionTitle"></b><p id="connectionNote"></p></div><button id="connect"></button></section>
<details class="connection-guide"><summary id="connectionGuideTitle"></summary><p id="connectionGuide"></p><a id="officialGuide" href="https://learn.chatgpt.com/docs/dots/tasks-and-memory" target="_blank" rel="noreferrer"></a></details>
<p class="notice" id="notice" role="status" aria-live="polite"></p>
<section id="composer" hidden class="panel"><h2 id="composerTitle"></h2><label id="taskLabel" for="taskText"></label><textarea id="taskText" maxlength="1200" rows="3"></textarea><label id="linkLabel" for="taskLink"></label><input id="taskLink" type="url" maxlength="180" placeholder="https://chatgpt.com/c/…"><p id="composerNote"></p><div class="actions"><button class="primary" id="saveTask"></button><button id="cancelTask"></button></div></section>
<div class="task-search"><label id="searchLabel" for="search"></label><input id="search" type="search" maxlength="120"></div>
<nav id="filters" aria-label="Tasks"></nav><section id="tasks" class="tasks"></section><section id="empty" class="empty"><span class="ring" aria-hidden="true"></span><h2 id="emptyTitle"></h2><p id="emptyNote"></p><button id="clearFilter" hidden></button></section>
<section id="handoffPanel" hidden class="panel"><h2 id="handoffTitle"></h2><p id="handoffHint"></p><div class="actions"><button id="draftProgress"></button><button id="draftContinue"></button></div><pre id="handoffText" tabindex="0"></pre><div class="actions"><button id="copyHandoff" class="primary"></button><button id="closeHandoff"></button></div><p id="handoffStatus" role="status"></p></section>
<section id="diagnosis" hidden class="panel"><h2 id="diagnosisTitle"></h2><p id="diagnosisScope"></p><div id="diagnosisText" class="answers"></div><button id="review" class="primary"></button></section>
<section id="reviewPanel" hidden class="panel"><h2 id="reviewTitle"></h2><p id="reviewHint"></p><pre id="privacy"></pre><pre id="report" tabindex="0"></pre><button id="copyReport" class="primary"></button><p id="copyStatus" role="status"></p></section>
<details class="advanced"><summary id="advancedTitle"></summary><p id="advancedNote"></p><input id="endpoint" placeholder="ws://127.0.0.1:12345" maxlength="40"><button id="connectEndpoint"></button><hr><label id="importLabel" for="importFile"></label><input type="file" id="importFile" accept=".json,application/json"></details>
<footer><p id="privacyFooter"></p><p>Task snapshot validation: <a href="https://github.com/KimYx0207/dot-task-board" target="_blank" rel="noreferrer">dot-task-board v0.2.0 (MIT)</a> · <a href="https://aiking.dev/" target="_blank" rel="noreferrer">aiking.dev</a> · <a href="https://x.com/KimYx0207" target="_blank" rel="noreferrer">@KimYx0207</a> · 微信：老金带你玩AI</p></footer></main><script type="module" src="/app.js"></script></body></html>
