name: publish-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out the public source commit
        uses: actions/checkout@v7

      - name: Validate the release tag and matching notes
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -notlike 'refs/tags/*') {
            throw "Release workflow must run from a tag."
          }
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag '$tag' must match vN.N.N."
          }
          $version = $tag.Substring(1)
          $notes = "docs/release-notes/$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes are missing: $notes"
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Verify source contains no local secrets or private paths
        shell: pwsh
        run: ./scripts/check-source-secrets.ps1

      - name: Build, run all tests, and create release packages
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version $env:APP_VERSION

      - name: Upload clean-build evidence
        uses: actions/upload-artifact@v7
        with:
          name: Codex-SOS-${{ github.ref_name }}-release-candidate
          path: |
            artifacts/packages/*
            artifacts/FILE-MANIFEST.txt
            artifacts/SHA256SUMS.txt
            artifacts/RELEASE-CHECK.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          }

          $installer = "artifacts/packages/Codex-SOS-Setup-$env:APP_VERSION.exe"
          $portable = "artifacts/packages/Codex-SOS-$env:APP_VERSION-win-x64-portable.zip"
          $checksums = "artifacts/SHA256SUMS.txt"
          $manifest = "artifacts/FILE-MANIFEST.txt"
          $preflight = "artifacts/RELEASE-CHECK.md"
          $notes = "docs/release-notes/$env:RELEASE_TAG.md"

          foreach ($required in @($installer, $portable, $checksums, $manifest, $preflight, $notes)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required release file missing: $required"
            }
          }

          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Codex SOS $env:RELEASE_TAG" `
            --notes-file $notes `
            $installer $portable $checksums $manifest $preflight
